# gitleaks configuration for the secret-scan workflow (.github/workflows/security.yml).
#
# Scope: keep the FULL built-in rule set. No broad ignores, no directory exclusions, no
# tests/ exclusion, no stopwords — those would hide real credentials.
# Verified with gitleaks 8.30.1 against the whole reachable history: the default rule set
# alone reports 0 findings, so no suppression is needed at introduction time.
#
# If a future false positive appears, suppress it ONLY with a narrow block of the commented
# shape below (condition = "AND" + a path regex + a literal that only the fictitious fixture
# contains), or with a single trailing `gitleaks:allow` comment on that line.
[extend]
useDefault = true

# --- Template for a narrowly-scoped fixture suppression (keep commented until needed) ---
# [[allowlists]]
# description = "Fictitious credential fixtures in the scanner test data only"
# condition = "AND"
# paths = ['''^tests/Fixtures/Secrets/[A-Za-z0-9_.-]+\.json$''']
# regexTarget = "match"
# regexes = ['''(?i)dummy[_-]?(password|secret|token)''']
